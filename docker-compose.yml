services:
  backend:
    build: 
      context: ./backend     # Set the context to the frontend folder
      dockerfile: Dockerfile    # Specify the Dockerfile inside the frontend folder
    ports:
      - "8000:8000"
   
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: '1234'
      DB_NAME: url_shortener
    depends_on:
      - db 
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '1234'
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persistent storage for the database

volumes:
  postgres_data: # Define the volume here
